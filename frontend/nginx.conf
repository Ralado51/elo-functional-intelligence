server {
    listen 8080;
    absolute_redirect off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS; resolution is refreshed when the API container changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream elo-functional-api;

    location = /api { return 308 /api/$is_args$args; }

    location /api/ {
        # A variable in proxy_pass requires an explicit replacement URI.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        # Backend uses --root-path /api and does not trust proxy headers.
        proxy_redirect http://$host/ /;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
